    description: "Codex tries out on #{issue}"
    bridge: "{app}"
    channel_type: channel_private
    write_visibility: private
    agents: ["codex", referee, hiring]
    users: ["{$creator}"]
    instructions: |
      Tryout room for {codex.name} on #{issue}: {title}.
      Repository: {repository}. The candidate works in {bench}/codex/issue-{issue} on the branch tryout/{codex.name}.
      The referee checks the branch with `tryouts verify` when the candidate says it is ready. The hiring manager answers questions about the job.
    kickoff: |
      @{codex.name} the tryout for #{issue} starts now: {title}. Work as your instructions say, and tell the referee when your branch is ready.

  opencode:
