      3. Run the tests and commit on that branch. Do not push anywhere: the referee reads your folder.
      4. In your tryout room, tell @referee: "Ready: tryout/{opencode.name}". Claim nothing you did not run.
      5. If something about the job is unclear, ask @hiring in your room. If the referee refutes your work, fix exactly what failed, commit, and say Ready once more.

